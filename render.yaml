# Render Blueprint — the API, plus the blip front end.
# The flick and kite front ends (and blip's too, if preferred) deploy to Vercel
# from apps/web; see DEPLOY.md. Every front end talks to this one API.
# Deploy: Render Dashboard → New + → Blueprint → pick this repo → Apply.
#
# Free plans sleep after ~15 min idle; the first request after a nap takes
# ~40s to wake the API. Upgrade to starter for always-on.
#
# The browser only calls same-origin /api (the Next rewrite proxies to the
# API server-to-server), so no CORS wiring is needed between the two.

services:
  - type: web
    name: blip-api
    runtime: node
    plan: free
    # NODE_ENV=production below makes npm skip devDependencies by default;
    # --include=dev forces them back in, since @nestjs/cli does the build.
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build --workspace @blip/api
    startCommand: npm run start:api
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # The public Solana RPC rate-limits the safety-score lookups. Put a
      # private endpoint here (Helius / QuickNode / Triton).
      - key: SOLANA_RPC_URL
        sync: false
      # Only needed for direct (non-proxied) browser calls — set to the web
      # service URL, e.g. https://blip-web-m0r3.onrender.com
      - key: CORS_ORIGIN
        sync: false
      # Deposits into held wallets are real money: credit only finalized ones.
      - key: SOLANA_COMMITMENT
        value: finalized
      # Brands this API serves. Each front end names itself in x-blip-tenant.
      - key: TENANTS
        value: blip,flick,kite
      # Custody (Privy server wallets). Unset = every front end runs in demo
      # mode. Per-brand overrides: PRIVY_APP_ID_FLICK, PRIVY_APP_SECRET_FLICK…
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      # Optional P-256 key that owns every new wallet. Back it up: losing it
      # locks those wallets.
      - key: PRIVY_AUTHORIZATION_KEY
        sync: false
      # Signing and broadcasting trades needs this to be exactly "true".
      - key: CUSTODY_LIVE_TRADING
        value: "false"
      - key: CUSTODY_MAX_TRADE_USD
        value: "250"

  - type: web
    name: blip-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build --workspace @blip/web
    startCommand: npm run start:web
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Where the Next server reaches the Nest API. This is the real allocated
      # API service URL — keep it in sync if the service is ever renamed.
      - key: API_ORIGIN
        value: https://blip-api-j0d4.onrender.com
      - key: NEXT_PUBLIC_BRAND
        value: blip
      # Same Privy app ID as PRIVY_APP_ID on the API. Unset = demo mode.
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
